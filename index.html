<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>River Raid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="touch" hidden>
      <div class="pad" aria-label="Direção">
        <button type="button" data-bit="up" aria-label="Acelerar">▲</button>
        <button type="button" data-bit="left" aria-label="Esquerda">◀</button>
        <button type="button" data-bit="down" aria-label="Frear">▼</button>
        <button type="button" data-bit="right" aria-label="Direita">▶</button>
      </div>
      <button type="button" class="fire" data-bit="fire" aria-label="Atirar">Tiro</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
